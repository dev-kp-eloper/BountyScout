name: Close Bounty Alert Issues

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  close-alerts:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close bounty alert issues
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            
            const { data: issues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              labels: 'bounty-alert',
              per_page: 100
            });
            
            const oneDayAgo = new Date(Date.now() - 24 * 60 * 60 * 1000);
            
            for (const issue of issues) {
              const createdAt = new Date(issue.created_at);
              
              if (createdAt < oneDayAgo && issue.title.includes('🎯 Bounty Alert:')) {
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: issue.number,
                  state: 'closed',
                  state_reason: 'completed'
                });
                
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issue.number,
                  body: '🤖 Auto-closing stale bounty alert (>24h old). New opportunities are posted daily.'
                });
                
                console.log(`Closed issue #${issue.number}: ${issue.title}`);
              }
            }
            
            console.log(`Processed ${issues.length} bounty alert issues`);
