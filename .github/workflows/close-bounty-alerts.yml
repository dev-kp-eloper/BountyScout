name: Close Stale Bounty Alerts

on:
  schedule:
    - cron: '0 */6 * * *'  # Run every 6 hours
  workflow_dispatch:

jobs:
  close-stale-alerts:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close stale bounty alert issues
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            
            // Get all open issues with bounty alert title pattern
            const issues = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              per_page: 100
            });
            
            const bountyAlertPattern = /^🎯 Bounty Alert:/i;
            const oneDayAgo = new Date(Date.now() - 24 * 60 * 60 * 1000);
            
            for (const issue of issues.data) {
              if (bountyAlertPattern.test(issue.title)) {
                const createdAt = new Date(issue.created_at);
                
                // Close if older than 24 hours
                if (createdAt < oneDayAgo) {
                  await github.rest.issues.update({
                    owner,
                    repo,
                    issue_number: issue.number,
                    state: 'closed'
                  });
                  
                  await github.rest.issues.createComment({
                    owner,
                    repo,
                    issue_number: issue.number,
                    body: 'Automatically closing stale bounty alert. This is an automated scan result that has been superseded by newer scans.'
                  });
                  
                  console.log(`Closed issue #${issue.number}: ${issue.title}`);
                }
              }
            }
