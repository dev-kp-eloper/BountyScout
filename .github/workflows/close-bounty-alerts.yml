name: Close Duplicate Bounty Alerts

on:
  issues:
    types: [opened]
  schedule:
    - cron: '0 1 * * *'

jobs:
  close-duplicates:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close duplicate bounty alert issues
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.issue?.title || '';
            const isBountyAlert = title.includes('🎯 Bounty Alert:') || title.includes('Bounty Alert:');
            
            if (!isBountyAlert && context.eventName === 'issues') {
              console.log('Not a bounty alert issue, skipping');
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            
            const { data: issues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              per_page: 100
            });
            
            const bountyAlerts = issues.filter(issue => 
              (issue.title.includes('🎯 Bounty Alert:') || issue.title.includes('Bounty Alert:')) &&
              issue.number !== context.payload.issue?.number
            );
            
            if (bountyAlerts.length === 0) {
              console.log('No duplicate bounty alerts found');
              return;
            }
            
            bountyAlerts.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            const keepIssue = bountyAlerts[0];
            const closeIssues = bountyAlerts.slice(1);
            
            console.log(`Keeping issue #${keepIssue.number}, closing ${closeIssues.length} duplicates`);
            
            for (const issue of closeIssues) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: issue.number,
                state: 'closed'
              });
              
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body: `Closing duplicate bounty alert. Latest scan results are tracked in #${keepIssue.number}`
              });
              
              console.log(`Closed issue #${issue.number}`);
            }
