name: Bounty Scout

on:
  schedule:
    - cron: '0 */6 * * *'  # Run every 6 hours
  workflow_dispatch:  # Allow manual trigger

jobs:
  scout-bounties:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run Bounty Scout
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node src/index.js

      - name: Create Issue for New Bounties
        if: success()
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            try {
              const resultsPath = path.join(process.env.GITHUB_WORKSPACE, 'results.json');
              
              if (!fs.existsSync(resultsPath)) {
                console.log('No results file found');
                return;
              }
              
              const results = JSON.parse(fs.readFileSync(resultsPath, 'utf8'));
              
              if (!results.newBounties || results.newBounties.length === 0) {
                console.log('No new bounties found');
                return;
              }
              
              const count = results.newBounties.length;
              const title = `🎯 Bounty Alert: ${count} New ${count === 1 ? 'Opportunity' : 'Opportunities'} Found`;
              
              let body = `## 🎯 New Bounty Opportunities\n\n`;
              body += `Found **${count}** new bounty ${count === 1 ? 'opportunity' : 'opportunities'}!\n\n`;
              
              results.newBounties.forEach((bounty, index) => {
                body += `### ${index + 1}. ${bounty.title}\n\n`;
                body += `- **Repository:** [${bounty.repo}](${bounty.repoUrl})\n`;
                body += `- **Issue:** [#${bounty.issueNumber}](${bounty.issueUrl})\n`;
                if (bounty.reward) {
                  body += `- **Reward:** ${bounty.reward}\n`;
                }
                if (bounty.labels && bounty.labels.length > 0) {
                  body += `- **Labels:** ${bounty.labels.map(l => `\`${l}\``).join(', ')}\n`;
                }
                if (bounty.language) {
                  body += `- **Language:** ${bounty.language}\n`;
                }
                body += `\n`;
              });
              
              body += `\n---\n`;
              body += `*Last scanned: ${new Date().toISOString()}*\n`;
              
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['bounty-alert', 'automated']
              });
              
              console.log(`Created issue: ${title}`);
            } catch (error) {
              console.error('Error creating issue:', error);
              throw error;
            }