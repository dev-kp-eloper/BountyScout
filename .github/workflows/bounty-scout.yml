name: Bounty Scout

on:
  schedule:
    - cron:  '0 */6 * * *'

jobs:
  bounty-scout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run Bounty Scout
        run: |
          python scout_bounties.py

      - name: Create Issue if New Bounties Found
        uses: JasonEtco/create-an-issue@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          filename: .github/ISSUE_TEMPLATE/bounty-alert.md