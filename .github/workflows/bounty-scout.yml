name: Bounty Scout

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  scout-bounties:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Run Bounty Scout
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node src/index.js

      - name: Commit and push if changed
        run: |
          git config --global user.name 'Bounty Scout Bot'
          git config --global user.email 'bot@bountyscout.com'
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update bounty data" && git push)
