export interface ValidationContext {
  isValid: boolean;
  isExpired?: boolean;
  timestamp?: number;
}

export function validateAndProcess(item?: ValidationContext | null): boolean {
  if (!item || typeof item !== 'object') {
    return false;
  }
  if (!item.isValid || item.isExpired) {
    return false;
  }
  return true;
}4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Bounty Scout
        env:
          # Required for GitHub API search and native issue notification
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
          # Optional: Configure Telegram notification secrets
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          
          # Optional: Configure Discord notification secrets
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python scout_bounties.py

      - name: Commit & Push Updated Seen Bounties State
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add seen_bounties.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update seen bounties state [skip ci]" && git push)
