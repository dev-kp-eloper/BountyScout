name: Label Bounty Alerts

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    if: contains(github.event.issue.title, 'Bounty Alert') || contains(github.event.issue.title, 'New Opportunityies') || contains(github.event.issue.title, 'New Opportunities')
    steps:
      - name: Add bounty-alert label
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['bounty-alert', 'automated']
            });
