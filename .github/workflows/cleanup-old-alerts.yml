name: Cleanup Old Bounty Alerts

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Close stale bounty alerts
        uses: actions/github-script@v7
        with:
          script: |
            const sevenDaysAgo = new Date();
            sevenDaysAgo.setDate(sevenDaysAgo.getDate() - 7);
            
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            
            const staleAlerts = issues.filter(issue => 
              issue.title.includes('Bounty Alert') &&
              new Date(issue.created_at) < sevenDaysAgo
            );
            
            for (const issue of staleAlerts) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed'
              });
              
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: 'Closed automatically: bounty alert older than 7 days'
              });
            }
            
            console.log(`Closed ${staleAlerts.length} stale bounty alerts`);
