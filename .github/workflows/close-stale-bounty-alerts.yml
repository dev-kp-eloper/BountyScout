name: Close Stale Bounty Alerts

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  close-stale-alerts:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close stale bounty alert issues
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const cutoffDate = new Date();
            cutoffDate.setHours(cutoffDate.getHours() - 48);
            
            const { data: issues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              labels: 'bounty-alert',
              per_page: 100
            });
            
            for (const issue of issues) {
              const title = issue.title || '';
              if (!title.includes('🎯 Bounty Alert:')) continue;
              
              const issueDate = new Date(issue.created_at);
              if (issueDate < cutoffDate) {
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: issue.number,
                  state: 'closed'
                });
                
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issue.number,
                  body: 'Closing stale bounty alert. Opportunities may have been claimed or expired.'
                });
                
                console.log(`Closed stale bounty alert #${issue.number}`);
              }
            }
