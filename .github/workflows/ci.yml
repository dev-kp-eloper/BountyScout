name: CI

on:
  push:
    branches: [ main, fix-* ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Test Suite
        run: python -m unittest discover -s . -p "test_*.py" -v
