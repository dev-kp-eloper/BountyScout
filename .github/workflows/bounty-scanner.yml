name: Bounty Scanner

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run bounty scanner
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node src/scanner.js
      
      - name: Create issue for new bounties
        uses: actions/github-script@v7
        env:
          BOUNTIES_JSON: ${{ steps.scan.outputs.bounties }}
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('bounties.json')) {
              console.log('No bounties found');
              return;
            }
            
            const bounties = JSON.parse(fs.readFileSync('bounties.json', 'utf8'));
            if (bounties.length === 0) {
              console.log('No new bounties');
              return;
            }
            
            let body = `### Active Bounty Scan Results\n\n**Scan Time:** ${new Date().toISOString().replace('T', ' ').substring(0, 16)} UTC\n\n`;
            
            bounties.forEach((bounty, index) => {
              body += `#### ${index + 1}. [${bounty.title}](${bounty.url})\n`;
              body += `- **Repository:** [${bounty.repo}](https://github.com/${bounty.repo})\n`;
              body += `- **Comments:** ${bounty.comments}\n`;
              body += `- **Last Updated:** ${bounty.updated_at}\n\n`;
            });
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🎯 Bounty Alert: ${bounties.length} New Opportunities Found`,
              body: body,
              labels: ['bounty-alert', 'automated']
            });
