name: Bounty Scanner

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Scan and create issue
        uses: actions/github-script@v7
        with:
          script: |
            const existingIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'bounty-alert',
              per_page: 10
            });

            const recentIssue = existingIssues.data.find(issue => {
              const createdAt = new Date(issue.created_at);
              const fourHoursAgo = new Date(Date.now() - 4 * 60 * 60 * 1000);
              return createdAt > fourHoursAgo;
            });

            if (recentIssue) {
              console.log('Recent bounty alert already exists, skipping creation');
              return;
            }

            const query = 'label:bounty,bug-bounty is:issue is:open created:>=' + 
              new Date(Date.now() - 4 * 60 * 60 * 1000).toISOString().split('T')[0];
            
            const searchResults = await github.rest.search.issuesAndPullRequests({
              q: query,
              sort: 'created',
              order: 'desc',
              per_page: 15
            });

            if (searchResults.data.total_count === 0) {
              console.log('No new bounties found');
              return;
            }

            const bounties = searchResults.data.items.slice(0, 12);
            const timestamp = new Date().toISOString().replace('T', ' ').substring(0, 16);
            
            let body = `### Active Bounty Scan Results\n\n**Scan Time:** ${timestamp} UTC\n\n`;
            
            bounties.forEach((bounty, index) => {
              body += `#### ${index + 1}. [${bounty.title}](${bounty.html_url})\n`;
              body += `- **Repository:** [${bounty.repository_url.split('/').slice(-2).join('/')}](${bounty.repository_url.replace('api.github.com/repos', 'github.com')})\n`;
              body += `- **Comments:** ${bounty.comments}\n`;
              body += `- **Last Updated:** ${bounty.updated_at}\n\n`;
            });

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🎯 Bounty Alert: ${bounties.length} New Opportunities Found`,
              body: body,
              labels: ['bounty-alert', 'automated']
            });
