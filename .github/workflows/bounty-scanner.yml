name: Bounty Scanner

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan for bounties
        id: scan
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const repos = [
              'mergemint-mint/mergemint-contracts',
              'Scottcjn/rustchain-bounties',
              'Pmobilee/Recall-Rogue'
            ];
            
            const bountyKeywords = ['bounty', 'reward', 'prize', 'RTC'];
            const results = [];
            
            for (const repo of repos) {
              try {
                const [owner, repoName] = repo.split('/');
                const { data: issues } = await github.rest.issues.listForRepo({
                  owner,
                  repo: repoName,
                  state: 'open',
                  per_page: 10,
                  sort: 'updated',
                  direction: 'desc'
                });
                
                const bountyIssues = issues.filter(issue => {
                  const text = `${issue.title} ${issue.body || ''}`.toLowerCase();
                  return bountyKeywords.some(keyword => text.includes(keyword.toLowerCase()));
                });
                
                results.push(...bountyIssues.slice(0, 2).map(issue => ({
                  title: issue.title,
                  url: issue.html_url,
                  repo: repo,
                  comments: issue.comments,
                  updated: issue.updated_at,
                  number: issue.number
                })));
              } catch (error) {
                console.log(`Error scanning ${repo}: ${error.message}`);
              }
            }
            
            results.sort((a, b) => new Date(b.updated) - new Date(a.updated));
            return results.slice(0, 5);

      - name: Create or update issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const results = ${{ steps.scan.outputs.result }};
            
            if (!results || results.length === 0) {
              console.log('No bounties found');
              return;
            }
            
            const now = new Date().toISOString().replace('T', ' ').substring(0, 16);
            
            let body = `### Active Bounty Scan Results\n\n`;
            body += `**Scan Time:** ${now} UTC\n\n`;
            
            results.forEach((result, index) => {
              body += `#### ${index + 1}. [${result.title}](${result.url})\n`;
              body += `- **Repository:** [${result.repo}](https://github.com/${result.repo})\n`;
              body += `- **Comments:** ${result.comments}\n`;
              body += `- **Last Updated:** ${result.updated}\n\n`;
            });
            
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'bounty-scan',
              per_page: 1
            });
            
            if (issues.length > 0) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body: body
              });
              console.log(`Updated issue #${issues[0].number}`);
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `🎯 Bounty Alert: ${results.length} New Opportunities Found`,
                body: body,
                labels: ['bounty-scan', 'automated']
              });
              console.log('Created new bounty scan issue');
            }
