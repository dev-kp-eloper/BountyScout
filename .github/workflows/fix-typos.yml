name: Fix Typos

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  fix-typos:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '16'
        
    - name: Install dependencies
      run: npm install
      
    - name: Run tests
      run: npm test
      
    - name: Check for typos
      run: |
        echo "Checking for common typos..."
        if grep -r "Opportunityies\|opportunityies\|Opportunitiy\|opportunitiy" --include="*.js" --include="*.md" --include="*.json" --exclude-dir=node_modules .; then
          echo "⚠️  Typos found! Running fix script..."
          npm run fix-typos
        else
          echo "✓ No typos found"
        fi
