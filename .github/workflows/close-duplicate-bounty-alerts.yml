name: Close Duplicate Bounty Alerts

on:
  issues:
    types: [opened]
  schedule:
    - cron: '0 */6 * * *'

jobs:
  deduplicate:
    runs-on: ubuntu-latest
    if: contains(github.event.issue.title, 'Bounty Alert') || github.event_name == 'schedule'
    
    permissions:
      issues: write
      contents: read
    
    steps:
      - name: Close duplicate bounty alerts
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            
            const { data: issues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              labels: 'bounty-scan',
              per_page: 100
            });
            
            const bountyAlerts = issues.filter(issue => 
              issue.title.includes('🎯 Bounty Alert') || 
              issue.title.includes('Bounty Alert')
            );
            
            if (bountyAlerts.length <= 1) {
              console.log('Only one or zero bounty alerts open, nothing to close');
              return;
            }
            
            bountyAlerts.sort((a, b) => 
              new Date(b.created_at) - new Date(a.created_at)
            );
            
            const latestAlert = bountyAlerts[0];
            const duplicates = bountyAlerts.slice(1);
            
            console.log(`Keeping issue #${latestAlert.number} (${latestAlert.created_at})`);
            console.log(`Closing ${duplicates.length} older alerts`);
            
            for (const issue of duplicates) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: issue.number,
                state: 'closed'
              });
              
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body: `Closing duplicate bounty alert. Latest scan results are in #${latestAlert.number}`
              });
              
              console.log(`Closed issue #${issue.number}`);
            }
