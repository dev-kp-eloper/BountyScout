name: Bounty Scanner

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: |
          npm install @octokit/rest
      
      - name: Scan for bounties
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const repos = [
              'akiver/cs-demo-manager',
              'opentoonz/opentoonz',
              'mergeos-bounties/Lappa',
              'attogram/rogue-blueberry'
            ];
            
            const bountyKeywords = ['bounty', 'reward', 'prize', '€', '$', '£'];
            const results = [];
            
            for (const repo of repos) {
              const [owner, repoName] = repo.split('/');
              
              try {
                const { data: issues } = await github.rest.issues.listForRepo({
                  owner,
                  repo: repoName,
                  state: 'open',
                  per_page: 10,
                  sort: 'updated',
                  direction: 'desc'
                });
                
                for (const issue of issues) {
                  const text = `${issue.title} ${issue.body || ''}`.toLowerCase();
                  const hasBounty = bountyKeywords.some(kw => text.includes(kw.toLowerCase()));
                  
                  if (hasBounty) {
                    results.push({
                      title: issue.title,
                      url: issue.html_url,
                      repo: repo,
                      comments: issue.comments,
                      updated: issue.updated_at
                    });
                  }
                }
              } catch (error) {
                console.log(`Error scanning ${repo}: ${error.message}`);
              }
            }
            
            if (results.length === 0) {
              console.log('No new bounties found');
              return;
            }
            
            const now = new Date().toISOString().replace('T', ' ').substring(0, 16);
            let body = `### Active Bounty Scan Results\n\n**Scan Time:** ${now} UTC\n\n`;
            
            results.forEach((result, idx) => {
              body += `#### ${idx + 1}. [${result.title}](${result.url})\n`;
              body += `- **Repository:** [${result.repo}](https://github.com/${result.repo})\n`;
              body += `- **Comments:** ${result.comments}\n`;
              body += `- **Last Updated:** ${result.updated}\n\n`;
            });
            
            const issueNumber = 640;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: body
            });
            
            console.log(`Posted ${results.length} bounty opportunities to issue #${issueNumber}`);
